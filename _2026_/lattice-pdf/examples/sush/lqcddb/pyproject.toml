[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lqcddb"
version = "0.0.2"
description = "Lattice QCD Distillation correlation function computation and analysis toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "LQCD Collaboration"},
]
keywords = [
    "lattice-qcd",
    "distillation",
    "wick-contraction",
    "correlation-function",
    "effective-mass",
    "GEVP",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

# Mandatory dependencies
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opt_einsum>=3.3",
    "matplotlib>=3.7",
]

# Optional dependency groups
[project.optional-dependencies]
gpu = ["cupy>=12.0"]
mpi = ["mpi4py>=3.1"]
sympy = ["sympy>=1.12"]
all = [
    "lqcddb[gpu,mpi,sympy]",
]

# Package discovery starts from the parent directory so that `lqcddb`
# is found as a top-level package with all its subpackages.
[tool.setuptools.packages.find]
where = ["src"]
include = ["lqcddb", "lqcddb.*"]

[tool.setuptools.package-data]
lqcddb = ["README.md", "physics.md"]
